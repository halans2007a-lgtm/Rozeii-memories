<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozii's memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #FFF5F7;
            --burgundy: #6E1F3A;
            --gold: #C9A45C;
            --gold-light: #E2C98A;
            --pink-card: #E8B7C3;
            --pink-soft: #F9E4EC;
            --white: #FFFFFF;
            --text-dark: #4A1325;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--burgundy);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* Top Action Bar */
        .action-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .btn {
            background-color: var(--gold);
            color: var(--white);
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(201, 164, 92, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn:hover {
            background-color: var(--burgundy);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(110, 31, 58, 0.3);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--gold);
            color: var(--burgundy);
        }

        .btn-outline:hover {
            background-color: var(--gold);
            color: var(--white);
        }

        /* Book Container */
        .book-container {
            width: 100%;
            max-width: 900px;
            height: 550px;
            position: relative;
            perspective: 2000px;
            margin-top: 40px;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Page Common Styles */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(110, 31, 58, 0.1);
            display: flex;
            overflow: hidden;
            backface-visibility: hidden;
            border: 2px solid var(--gold-light);
        }

        /* Cover Page */
        .cover-page {
            background: linear-gradient(135deg, var(--burgundy) 0%, #4A1325 100%);
            color: var(--gold);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            border: 4px solid var(--gold);
        }

        .cover-title {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: var(--gold);
        }

        .cover-subtitle {
            font-size: 1.2rem;
            color: var(--pink-card);
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .open-book-btn {
            background-color: var(--gold);
            color: var(--burgundy);
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(201, 164, 92, 0.5);
            transition: all 0.3s;
        }

        .open-book-btn:hover {
            background-color: var(--white);
            transform: scale(1.05);
        }

        /* Content Pages */
        .content-page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--pink-soft);
        }

        .page-left {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 2px dashed rgba(201, 164, 92, 0.4);
            background-color: var(--white);
        }

        .page-right {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--pink-card);
            position: relative;
        }

        .memory-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .memory-img:hover {
            transform: scale(1.02);
        }

        .page-title {
            font-size: 2rem;
            color: var(--burgundy);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .page-story {
            font-size: 1rem;
            color: var(--text-dark);
            line-height: 1.8;
            font-weight: 400;
        }

        /* Secret Sticker */
        .secret-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: var(--burgundy);
            color: var(--gold);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid var(--gold);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .secret-badge:hover {
            background-color: var(--gold);
            color: var(--burgundy);
        }

        /* Canvas Page */
        .canvas-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background-color: var(--white);
        }

        .canvas-container {
            border: 3px solid var(--gold);
            border-radius: 8px;
            background: var(--bg-color);
            cursor: crosshair;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .palette {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Navigation Controls */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-top: 25px;
            align-items: center;
        }

        .page-indicator {
            font-weight: 600;
            color: var(--burgundy);
            font-size: 1.1rem;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 19, 37, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--white);
            padding: 35px;
            border-radius: 15px;
            width: 100%;
            max-width: 550px;
            border: 3px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: var(--burgundy);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--burgundy);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--pink-card);
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--gold);
        }

        textarea.form-control {
            resize: vertical;
            height: 100px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Top Action Bar -->
    <div class="action-bar">
        <button class="btn btn-outline" onclick="openEditModal()">✏️ Manage Pages</button>
    </div>

    <!-- Main Book Container -->
    <div class="book-container">
        <div class="book" id="bookElement">
            <!-- Dynamic Pages -->
        </div>
    </div>

    <!-- Bottom Navigation Controls -->
    <div class="nav-controls" id="navControls" style="display: none;">
        <button class="btn" onclick="prevPage()">❮ Previous</button>
        <div class="page-indicator" id="pageIndicator">Page 1 of X</div>
        <button class="btn" onclick="nextPage()">Next ❯</button>
    </div>

    <!-- Edit Album Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>Manage & Add Infinite Memories</h3>
            <div id="pagesEditorList"></div>
            <button class="btn btn-outline" style="width: 100%; margin-top: 15px;" onclick="addNewPageForm()">+ Add New Memory Page</button>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                <button class="btn" onclick="saveAndApplyChanges()">Save & Update Database</button>
            </div>
        </div>
    </div>

    <!-- Secret Note Modal -->
    <div class="modal" id="secretModal">
        <div class="modal-content" style="text-align: center;">
            <h3 style="color: var(--gold);">✨ Secret Note</h3>
            <p id="secretModalText" style="font-size: 1.1rem; line-height: 1.8; color: var(--burgundy); margin-bottom: 20px;"></p>
            <button class="btn" onclick="closeSecretModal()">Close</button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDUtNuJvUOrOLxicZ-QOCHItXFQvPaFMcU",
            authDomain: "rozii-memories-e68dd.firebaseapp.com",
            projectId: "rozii-memories-e68dd",
            storageBucket: "rozii-memories-e68dd.firebasestorage.app",
            messagingSenderId: "339553623893",
            appId: "1:339553623893:web:912b55be1ec84fbf6619dc"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let defaultPages = [
            {
                title: "The Beginning",
                story: "The moment our paths crossed, everything felt different. A quiet connection built on deep understanding, art, and logic.",
                image: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80",
                secret: "I knew from day one that you were someone extraordinarily rare."
            },
            {
                title: "Code & Colors",
                story: "Watching you balance the precise world of computer science with the beautiful, chaotic freedom of painting is truly inspiring.",
                image: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80",
                secret: "You bring color into even the most logical lines of life."
            }
        ];

        let pages = [];
        let currentPage = 0;

        // Load data from Firebase database
        async function initData() {
            try {
                const doc = await db.collection("albums").doc("rozii_memories_data").get();
                if (doc.exists && doc.data().pages) {
                    pages = doc.data().pages;
                } else {
                    pages = [...defaultPages];
                }
            } catch (error) {
                console.error("Error loading from DB, using defaults", error);
                pages = [...defaultPages];
            }
            renderBook();
        }

        function renderBook() {
            const book = document.getElementById('bookElement');
            const navControls = document.getElementById('navControls');
            let html = '';

            // Cover Page (Index 0)
            html = `
                <div class="page cover-page" style="z-index: ${pages.length + 2}; display: ${currentPage === 0 ? 'flex' : 'none'};">
                    <h1 class="cover-title">Rozii's memories</h1>
                    <p class="cover-subtitle">A sanctuary crafted just for you, woven with gold, burgundy, and pink.</p>
                    <button class="open-book-btn" onclick="openBook()">Open Book</button>
                </div>
            `;

            // Infinite Content Pages
            pages.forEach((p, idx) => {
                const pageNum = idx + 1;
                const isVisible = currentPage === pageNum;
                html += `
                    <div class="page content-page" style="z-index: ${pages.length - idx}; display: ${isVisible ? 'grid' : 'none'};">
                        <div class="page-left">
                            <h2 class="page-title">${escapeHtml(p.title)}</h2>
                            <p class="page-story">${escapeHtml(p.story)}</p>
                        </div>
                        <div class="page-right">
                            <img src="${escapeHtml(p.image)}" alt="Memory" class="memory-img" onclick="window.open('${escapeHtml(p.image)}', '_blank')">
                            ${p.secret ? `<div class="secret-badge" onclick="showSecret('${escapeHtml(p.secret)}')">✨ Tap for Secret</div>` : ''}
                        </div>
                    </div>
                `;
            });

            // Canvas Page at the end
            const canvasPageIndex = pages.length + 1;
            const isCanvasVisible = currentPage === canvasPageIndex;
            html += `
                <div class="page canvas-page" style="z-index: 0; display: ${isCanvasVisible ? 'flex' : 'none'};">
                    <h2 class="page-title" style="margin-bottom: 10px;">Your Canvas</h2>
                    <p style="color: var(--burgundy); margin-bottom: 15px; font-size: 0.9rem;">Express your thoughts right here using your favorite colors.</p>
                    <canvas id="drawingCanvas" class="canvas-container" width="400" height="250"></canvas>
                    <div class="palette">
                        <div class="color-dot" style="background-color: #6E1F3A;" onclick="setBrushColor('#6E1F3A')"></div>
                        <div class="color-dot" style="background-color: #E8B7C3;" onclick="setBrushColor('#E8B7C3')"></div>
                        <div class="color-dot" style="background-color: #C9A45C;" onclick="setBrushColor('#C9A45C')"></div>
                        <button class="btn btn-outline" style="padding: 5px 12px; font-size: 12px; margin-left: 10px;" onclick="clearCanvas()">Clear</button>
                    </div>
                </div>
            `;

            book.innerHTML = html;

            if (currentPage > 0) {
                navControls.style.display = 'flex';
                document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${pages.length + 1}`;
            } else {
                navControls.style.display = 'none';
            }

            if (isCanvasVisible) {
                initCanvas();
            }
        }

        function openBook() {
            currentPage = 1;
            renderBook();
        }

        function nextPage() {
            const maxPage = pages.length + 1;
            if (currentPage < maxPage) {
                currentPage++;
                renderBook();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderBook();
            }
        }

        function showSecret(text) {
            document.getElementById('secretModalText').innerText = text;
            document.getElementById('secretModal').style.display = 'flex';
        }

        function closeSecretModal() {
            document.getElementById('secretModal').style.display = 'none';
        }

        // Canvas Drawing Setup
        let canvasCtx = null;
        let painting = false;
        let currentColor = '#6E1F3A';

        function initCanvas() {
            const canvas = document.getElementById('drawingCanvas');
            if (!canvas) return;
            canvasCtx = canvas.getContext('2d');
            canvasCtx.lineWidth = 3;
            canvasCtx.lineCap = 'round';

            canvas.onmousedown = startPosition;
            canvas.onmouseup = finishedPosition;
            canvas.onmousemove = draw;
            
            canvas.ontouchstart = (e) => { startPosition(e.touches[0]); e.preventDefault(); };
            canvas.ontouchend = finishedPosition;
            canvas.ontouchmove = (e) => { draw(e.touches[0]); e.preventDefault(); };
        }

        function setBrushColor(color) {
            currentColor = color;
        }

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function finishedPosition() {
            painting = false;
            canvasCtx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            const canvas = document.getElementById('drawingCanvas');
            const rect = canvas.getBoundingClientRect();
            canvasCtx.strokeStyle = currentColor;
            canvasCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            canvasCtx.stroke();
            canvasCtx.beginPath();
            canvasCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() {
            const canvas = document.getElementById('drawingCanvas');
            if (canvasCtx) {
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // Edit & Database Save Management
        function openEditModal() {
            const list = document.getElementById('pagesEditorList');
            let html = '';
            pages.forEach((p, idx) => {
                html += `
                    <div style="background: var(--pink-soft); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--gold);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <strong style="color: var(--burgundy);">Page #${idx + 1}</strong>
                            <button class="btn btn-outline" style="padding: 3px 8px; font-size: 11px; color: #a94442; border-color: #a94442;" onclick="deletePageForm(${idx})">Delete</button>
                        </div>
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" class="form-control" id="edit_title_${idx}" value="${escapeAttr(p.title)}">
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" class="form-control" id="edit_img_${idx}" value="${escapeAttr(p.image)}">
                        </div>
                        <div class="form-group">
                            <label>Story / Description</label>
                            <textarea class="form-control" id="edit_story_${idx}">${escapeAttr(p.story)}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Secret Note (Optional)</label>
                            <input type="text" class="form-control" id="edit_secret_${idx}" value="${escapeAttr(p.secret || '')}">
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            document.getElementById('editModal').style.display = 'flex';
        }

        function addNewPageForm() {
            pages.push({
                title: "New Memory",
                story: "Write your sweet story here...",
                image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80",
                secret: "Your secret note here..."
            });
            openEditModal();
        }

        function deletePageForm(idx) {
            pages.splice(idx, 1);
            openEditModal();
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveAndApplyChanges() {
            pages.forEach((p, idx) => {
                const t = document.getElementById(`edit_title_${idx}`);
                const i = document.getElementById(`edit_img_${idx}`);
                const s = document.getElementById(`edit_story_${idx}`);
                const sec = document.getElementById(`edit_secret_${idx}`);
                if (t) p.title = t.value;
                if (i) p.image = i.value;
                if (s) p.story = s.value;
                if (sec) p.secret = sec.value;
            });

            try {
                await db.collection("albums").doc("rozii_memories_data").set({ pages: pages });
                alert("✨ Memories saved successfully to database!");
            } catch (error) {
                alert("Error saving to database: " + error.message);
            }

            closeEditModal();
            currentPage = 0;
            renderBook();
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeAttr(str) {
            return (str || '').replace(/"/g, '&quot;');
        }

        // Initialize and load from database on start
        initData();
    </script>
</body>
</html>
